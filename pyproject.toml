[tool.poetry]
name = "mamimo"
version = "0.4.3"
description = "A package to create marketing mix models."
authors = ["Robert Kübler <xgarve@gmail.com>"]
repository = "https://github.com/Garve/mamimo"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
scikit-learn = "^1.6.0"
numpy = "^1.24.0"
pandas = "^2.0.0"
scipy = "^1.10.0"

[tool.poetry.dev-dependencies]
black = "^22.3.0"
flake8 = "^4.0.1"
isort = "^5.10.1"
mypy = "^0.950"
pre-commit = "^2.18.1"
pydocstyle = "^6.1.1"
pytest = "^7.1.2"
Sphinx = "^5.2.2"
hypothesis = "^6.59.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"